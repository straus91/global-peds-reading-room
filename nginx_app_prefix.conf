# Nginx Configuration for /app/ Prefix Architecture
# Global Peds Reading Room - Beta Environment
#
# This configuration implements the industry-standard URL structure:
# - /app/         → Frontend static files (HTML, CSS, JS)
# - /api/         → Django REST API (proxied to Gunicorn)
# - /admin/       → Django admin interface (proxied to Gunicorn)
# - /orthanc/     → DICOM server (if applicable)
#
# Installation Instructions:
# 1. Backup current config:
#    sudo cp /etc/nginx/sites-available/globalpeds /etc/nginx/sites-available/globalpeds.backup
# 2. Copy this file to server:
#    scp nginx_app_prefix.conf deploy@64.225.17.0:/tmp/
# 3. Move to sites-available:
#    sudo mv /tmp/nginx_app_prefix.conf /etc/nginx/sites-available/globalpeds
# 4. Test configuration:
#    sudo nginx -t
# 5. If test passes, reload:
#    sudo systemctl reload nginx

upstream gunicorn_backend {
    server 127.0.0.1:8001 fail_timeout=0;
}

# Redirect HTTP to HTTPS (production only)
# Uncomment when SSL is configured
# server {
#     listen 80;
#     server_name 64.225.17.0;
#     return 301 https://$server_name$request_uri;
# }

server {
    listen 80;
    server_name 64.225.17.0;

    # Server tokens off for security
    server_tokens off;

    # Increase max body size for DICOM uploads
    client_max_body_size 100M;

    # Logging
    access_log /var/log/nginx/globalpeds_access.log;
    error_log /var/log/nginx/globalpeds_error.log warn;

    # Charset
    charset utf-8;

    # ============================================
    # FRONTEND STATIC FILES - /app/ PREFIX
    # ============================================

    # Serve frontend application under /app/
    location /app/ {
        alias /home/deploy/global-peds-reading-room/frontend/;
        try_files $uri $uri/ =404;

        # Caching for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # No caching for HTML files (for updates)
        location ~* \.(html)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }
    }

    # Redirect root to /app/
    location = / {
        return 301 /app/;
    }

    # ============================================
    # DJANGO API - /api/ PREFIX
    # ============================================

    location /api/ {
        proxy_pass http://gunicorn_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Timeouts for long-running requests (AI feedback)
        proxy_connect_timeout 75s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
    }

    # ============================================
    # DJANGO ADMIN - /admin/ PREFIX
    # ============================================

    location /admin/ {
        proxy_pass http://gunicorn_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ============================================
    # DJANGO STATIC FILES (Admin CSS/JS)
    # ============================================

    location /static/ {
        alias /home/deploy/global-peds-reading-room/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ============================================
    # MEDIA FILES (User uploads)
    # ============================================

    location /media/ {
        alias /home/deploy/global-peds-reading-room/backend/media/;
        expires 1y;
        add_header Cache-Control "public";
    }

    # ============================================
    # ORTHANC DICOM SERVER (Optional)
    # ============================================

    # Uncomment if Orthanc is running locally
    # location /orthanc/ {
    #     proxy_pass http://localhost:8042/;
    #     proxy_set_header Host $http_host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_redirect off;
    #
    #     # Increase timeouts for DICOM transfers
    #     proxy_connect_timeout 300s;
    #     proxy_send_timeout 300s;
    #     proxy_read_timeout 300s;
    # }

    # ============================================
    # SECURITY HEADERS
    # ============================================

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================
    # ERROR PAGES
    # ============================================

    error_page 404 /app/404.html;
    error_page 500 502 503 504 /app/50x.html;
}

# ============================================
# CONFIGURATION NOTES
# ============================================
#
# 1. PATH RESOLUTION:
#    - /app/index.html → /home/deploy/.../frontend/index.html
#    - /app/admin/dashboard.html → /home/deploy/.../frontend/admin/dashboard.html
#    - /api/cases/ → Proxied to Gunicorn on port 8001
#
# 2. TESTING AFTER DEPLOYMENT:
#    - Frontend: curl http://64.225.17.0/app/
#    - API: curl http://64.225.17.0/api/
#    - Admin: curl http://64.225.17.0/admin/
#
# 3. TROUBLESHOOTING:
#    - Check Nginx logs: sudo tail -f /var/log/nginx/globalpeds_error.log
#    - Test config: sudo nginx -t
#    - Reload: sudo systemctl reload nginx
#
# 4. COMMON ISSUES:
#    - 404 on /app/: Check alias path and file permissions
#    - 502 on /api/: Check Gunicorn is running on port 8001
#    - CORS errors: Update Django CORS_ALLOWED_ORIGINS in settings.py
#
# 5. PERFORMANCE OPTIMIZATION:
#    - Enable gzip compression (see nginx gzip settings)
#    - Configure browser caching (already set above)
#    - Consider CDN for static assets in production
